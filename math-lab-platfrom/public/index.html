<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathCat Lab</title><link rel="icon" href="/cat.svg?v=3" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/research-board.css"><link rel="stylesheet" href="/whiteboard.css"><link rel="stylesheet" href="/codex-status.css"><link rel="stylesheet" href="/vendor/katex/katex.min.css"></head><body>
<div class="shell"><aside id="conversationSidebar" class="sidebar" aria-label="会话列表"><button id="sidebarClose" class="mobile-sidebar-close" type="button" aria-label="关闭会话列表">关闭会话列表 ×</button><div class="brand"><div class="brand-mark"><svg class="brand-cat" viewBox="0 0 64 64" aria-hidden="true"><path d="M15 27 13 13l13 7a30 30 0 0 1 12 0l13-7-2 14a21 21 0 0 1 3 11c0 11-9 17-20 17s-20-6-20-17c0-4 1-8 3-11Z"/><path class="cat-face" d="M20 35c2-2 4-2 6 0m12 0c2-2 4-2 6 0M32 39l-2 2 2 2 2-2-2-2ZM25 47c4 3 10 3 14 0"/></svg></div><div><strong>MathCat Lab</strong><span>本地数学智能体平台喵</span></div></div><button id="newChat" class="primary wide">＋ 新对话</button><div class="section-head"><span>工作区与对话</span><span><button id="refresh" title="刷新">↻</button><button id="addWorkspace" title="添加工作区">＋</button></span></div><nav id="workspaceTree" class="workspace-tree"></nav><div class="sidebar-bottom"><button id="settingsButton" class="settings-button" type="button" aria-haspopup="dialog"><span aria-hidden="true">⚙</span><span>设置</span><small id="settingsSummary">正在读取模型与每周额度…</small></button><div id="health" class="health">正在检查 Codex…</div></div></aside>
<button id="sidebarBackdrop" class="sidebar-backdrop" type="button" aria-label="关闭会话列表" tabindex="-1" hidden></button><main><header><button id="sidebarToggle" class="mobile-sidebar-toggle" type="button" aria-controls="conversationSidebar" aria-expanded="false" aria-label="打开会话列表">☰ 会话</button><div class="conversation-heading"><strong id="title">新对话</strong><span id="workspaceName">尚未选择工作区</span></div><div class="header-actions"><span id="status" class="status">就绪</span></div></header><section id="messages" class="messages"><div class="welcome"><div class="hero"><svg class="brand-cat" viewBox="0 0 64 64" aria-hidden="true"><path d="M15 27 13 13l13 7a30 30 0 0 1 12 0l13-7-2 14a21 21 0 0 1 3 11c0 11-9 17-20 17s-20-6-20-17c0-4 1-8 3-11Z"/><path class="cat-face" d="M20 35c2-2 4-2 6 0m12 0c2-2 4-2 6 0M32 39l-2 2 2 2 2-2-2-2ZM25 47c4 3 10 3 14 0"/></svg></div><h1>数学科研，从一个问题开始喵</h1><p>选择本地工作区，通过 Codex 对话或调用专业数学能力。</p></div></section><section class="composer"><div class="toolbar"><div class="capability-picker"><button id="capabilityTrigger" class="capability-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="capabilityIcon"></span><span id="capabilityLabel">普通对话喵</span><span class="picker-chevron">⌄</span></button><div id="capabilityMenu" class="capability-menu" role="listbox" hidden></div><select id="capability" hidden aria-hidden="true"><option value="">普通对话喵</option></select></div></div><textarea id="prompt" placeholder="向 MathCat Lab 提问，或描述要执行的数学任务…"></textarea><div class="send-row"><span id="hint">普通对话喵</span><button id="send" class="send" type="button" aria-label="提交消息"><span>提交</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15V5m0 0L6.5 8.5M10 5l3.5 3.5"/></svg></button></div></section></main></div>
<dialog id="workspaceDialog"><form method="dialog"><h2>添加工作区</h2><p>选择已有本地文件夹，任务只在该目录中读写。</p><label>文件夹路径<input id="workspacePath" placeholder="D:\research\my-project"></label><label>显示名称<input id="workspaceLabel" placeholder="例如：谱图论研究"></label><div class="dialog-actions"><button value="cancel">取消</button><button type="button" id="browse">选择文件夹…</button><button type="button" id="saveWorkspace" class="primary">添加</button></div><p id="dialogError" class="error"></p></form></dialog>
<dialog id="settingsDialog" class="settings-dialog"><form method="dialog"><div class="settings-dialog-head"><div><h2>设置</h2><p>运行设置会应用于之后发送的消息。</p></div><button class="dialog-close" value="cancel" aria-label="关闭设置">×</button></div><div class="settings-fields"><label><span>执行器</span><small>负责运行本地任务的命令行智能体</small><select id="executor" aria-label="选择执行器"><option value="codex">Codex CLI</option></select></label><label><span>工作权限</span><small>控制 Codex 是否能够修改工作区文件</small><select id="permission" aria-label="工作区权限"><option value="workspace-write">可覆写</option><option value="read-only">只读</option></select></label></div><div id="codexSettingsPanel"></div><div class="dialog-actions"><button class="primary" value="done">完成</button></div></form></dialog>
<script type="module" src="/app.js"></script></body></html>
